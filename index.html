<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golf-Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0f1724;color:#eee;margin:0}
.container{max-width:1250px;margin:auto;padding:20px}
h1{margin:0 0 10px;font-size:24px}
h2{margin-top:0}
.card{background:rgba(255,255,255,0.03);padding:16px;border-radius:10px;margin-bottom:20px}
select,input,button{padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:#1b2637;color:#eee;margin:2px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,0.05);text-align:center}
.eagle{background:#4ade80}.birdie{background:#22d3ee}.par{background:#60a5fa}.bogey{background:#facc15}.dbl{background:#f87171}
</style>
</head>
<body>
<div class="container">
<h1>Golf-Turnier-Dashboard</h1>

<div class="card">
<h2>Plätze verwalten</h2>
<form id="courseForm">
Name <input id="cName" required>
Tee-Farbe <input id="cColor" type="color" value="#0066cc">
Slope <input id="cSlope" type="number" required style="width:80px">
Course Rating <input id="cCR" type="number" required style="width:80px">
<button type="button" onclick="showHoleInputs()">Löcher definieren</button>
<button type="submit">Platz anlegen</button>
</form>
<div id="holesForm"></div>
<div id="courseList"></div>
</div>

<div class="card">
<h2>Turnier anlegen</h2>
<form id="tournamentForm">
Datum <input type="date" id="tDate" required>
Name <input id="tName" required>
Club <input id="tClub" required>
Platz <select id="tCourse"></select>
HandicapIndex <input type="number" id="tHcp" style="width:80px">
Spielform <select id="tFormat"><option>Stroke</option><option>Stableford</option></select>
<button type="submit">Turnier anlegen</button>
</form>
<div id="holeEntry"></div>
</div>

<div class="card">
<h2>Übersicht</h2>
<select id="filterYear"></select>
<button onclick="applyFilters()">Anwenden</button>
<button onclick="resetFilters()">Reset</button>
<div id="summary"></div>
<canvas id="chartScores" height="100"></canvas>
</div>

<div class="card">
<h2>Birdies</h2>
<div id="birdieList"></div>
</div>

<div class="card">
<h2>Best Scores pro Loch</h2>
<select id="bestCourse" onchange="renderBestOfHole()"></select>
<div id="bestTable"></div>
</div>

<div class="card">
<h2>Turniere (letzte)</h2>
<div id="recentList"></div>
</div>
</div>

<script>
const STORAGE_KEY='golf_dash_full2';
let state={courses:[],tournaments:[]};
if(localStorage.getItem(STORAGE_KEY))state=JSON.parse(localStorage.getItem(STORAGE_KEY));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function uid(p='id'){return p+Math.random().toString(36).slice(2,9)}
function fmtDate(d){return new Date(d).toLocaleDateString('de-DE')}
function classify(par,strokes){
 if(!strokes||strokes<=0)return'';
 const diff=strokes-par;
 if(diff<=-2)return'eagle';
 if(diff==-1)return'birdie';
 if(diff==0)return'par';
 if(diff==1)return'bogey';
 return'dbl';
}

/* Hole inputs for new course */
function showHoleInputs(){
 let html='<table><tr><th>Loch</th><th>Par</th><th>HCP</th></tr>';
 for(let i=1;i<=18;i++){
 html+=`<tr><td>${i}</td><td><input type="number" id="par${i}" value="4" style="width:50px"></td><td><input type="number" id="hcp${i}" value="${i}" style="width:50px"></td></tr>`;
 }
 html+='</table>';
 document.getElementById('holesForm').innerHTML=html;
}

/* Course create */
document.getElementById('courseForm').addEventListener('submit',e=>{
 e.preventDefault();
 const holes=[];
 for(let i=1;i<=18;i++){
 holes.push({num:i,par:+document.getElementById('par'+i).value,hcp:+document.getElementById('hcp'+i).value});
 }
 const c={id:uid('c'),name:cName.value,teeColor:cColor.value,slope:+cSlope.value,courseRating:+cCR.value,
 holes:holes,par:holes.reduce((s,h)=>s+h.par,0)};
 state.courses.push(c);save();renderCourses();populateCourseDropdowns();
 cName.value='';document.getElementById('holesForm').innerHTML='';
});
function renderCourses(){
 let html='';
 state.courses.forEach(c=>{html+=`<div><strong>${c.name}</strong> (Slope ${c.slope}, CR ${c.courseRating})</div>`});
 document.getElementById('courseList').innerHTML=html;
}
function populateCourseDropdowns(){
 document.getElementById('tCourse').innerHTML='<option value="">-- Platz --</option>'+state.courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
 document.getElementById('bestCourse').innerHTML='<option value="">-- Platz --</option>'+state.courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

/* Tournament create */
document.getElementById('tournamentForm').addEventListener('submit',e=>{
 e.preventDefault();
 const cid=tCourse.value;const c=state.courses.find(x=>x.id===cid);if(!c)return alert('Platz wählen');
 const t={id:uid('t'),name:tName.value,club:tClub.value,date:tDate.value,courseId:cid,handicapIndex:+tHcp.value,format:tFormat.value,
 holes:c.holes.map(h=>({num:h.num,par:h.par,hcp:h.hcp,strokes:h.par,stroked:false}))};
 state.tournaments.push(t);save();
 renderHoleEntry(t);renderAll();
});
function renderHoleEntry(t){
 const div=document.getElementById('holeEntry');
 let html=`<h3>Löcher für ${t.name}</h3><table><tr><th>Loch</th><th>Par</th><th>HCP</th><th>Strokes</th><th>Streichen</th></tr>`;
 t.holes.forEach(h=>{
 html+=`<tr>
 <td>${h.num}</td><td>${h.par}</td><td>${h.hcp}</td>
 <td><input type="number" value="${h.strokes}" style="width:50px" onchange="updateHole('${t.id}',${h.num},this.value)"></td>
 <td><input type="checkbox" ${h.stroked?'checked':''} onchange="toggleStroke('${t.id}',${h.num},this.checked)"></td>
 </tr>`;
 });
 html+='</table>';
 div.innerHTML=html;
}
function updateHole(tid,num,val){
 const t=state.tournaments.find(x=>x.id===tid);const h=t.holes.find(x=>x.num===num);h.strokes=+val;save();renderAll();
}
function toggleStroke(tid,num,checked){
 const t=state.tournaments.find(x=>x.id===tid);const h=t.holes.find(x=>x.num===num);h.stroked=checked;save();renderAll();
}

/* Summary + Chart */
let currentYear='';let chartScores;
function applyFilters(){currentYear=document.getElementById('filterYear').value;renderAll()}
function resetFilters(){currentYear='';renderAll()}
function sumAdjGross(t){return t.holes.reduce((s,h)=>s+(h.strokes||0),0)}
function renderSummaryAndChart(){
 const data=state.tournaments.filter(t=>!currentYear||new Date(t.date).getFullYear().toString()==currentYear);
 const total=data.length;const n18=data.filter(t=>t.holes.length>=18).length;const n9=data.filter(t=>t.holes.length<18).length;
 document.getElementById('summary').innerHTML=`<p>Gesamt: ${total} | 18-Loch: ${n18} | 9-Loch: ${n9}</p>`;
 const labels=data.map(t=>fmtDate(t.date));const scores=data.map(t=>sumAdjGross(t));
 if(chartScores)chartScores.destroy();
 chartScores=new Chart(document.getElementById('chartScores'),{type:'line',data:{labels,datasets:[{label:'Score',data:scores}]},options:{plugins:{legend:{display:false}}}});
}

/* Birdies */
function renderBirdies(){
 const div=document.getElementById('birdieList');div.innerHTML='';
 const birdies=[];
 state.tournaments.forEach(t=>{
 if(currentYear&&new Date(t.date).getFullYear().toString()!=currentYear)return;
 const c=state.courses.find(x=>x.id===t.courseId);
 t.holes.forEach(h=>{if(classify(h.par,h.strokes)=='birdie')birdies.push({date:t.date,course:c?c.name:'?',hole:h.num});});
 });
 if(!birdies.length){div.textContent='Keine Birdies';return}
 div.innerHTML='<table><tr><th>Datum</th><th>Platz</th><th>Loch</th></tr>'+birdies.map(b=>`<tr><td>${fmtDate(b.date)}</td><td>${b.course}</td><td>${b.hole}</td></tr>`).join('')+'</table>';
}

/* Best-of-Hole */
function renderBestOfHole(){
 const id=document.getElementById('bestCourse').value;const c=state.courses.find(x=>x.id===id);
 if(!c){document.getElementById('bestTable').innerHTML='';return}
 const best=Array.from({length:c.holes.length}).map(()=>null);
 state.tournaments.forEach(t=>{
 if(t.courseId!==id)return;if(currentYear&&new Date(t.date).getFullYear().toString()!=currentYear)return;
 t.holes.forEach(h=>{const idx=h.num-1;if(!best[idx]||h.strokes<best[idx])best[idx]=h.strokes;});
 });
 let html='<table><tr><th>Loch</th><th>Par</th><th>Bester Score</th></tr>';
 c.holes.forEach((h,i)=>{const sc=best[i];const cls=sc?classify(h.par,sc):'';html+=`<tr><td>${h.num}</td><td>${h.par}</td><td class="${cls}">${sc?sc:'-'}</td></tr>`});
 html+='</table>';document.getElementById('bestTable').innerHTML=html;
}

/* Recent list */
function renderRecentList(){
 const div=document.getElementById('recentList');div.innerHTML='';
 const list=state.tournaments.filter(t=>!currentYear||new Date(t.date).getFullYear().toString()==currentYear).slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
 list.forEach(t=>{
 const c=state.courses.find(x=>x.id===t.courseId);
 let html=`<div style="margin-bottom:8px"><strong>${t.name}</strong> (${fmtDate(t.date)}) ${c?c.name:''}<br><table><tr>`;
 t.holes.forEach(h=>{const cls=classify(h.par,h.strokes);html+=`<td class="${cls}">${h.strokes}</td>`});
 html+='</tr></table></div>';div.innerHTML+=html;
 });
}

/* Filters populate */
function populateFilters(){
 const years=Array.from(new Set(state.tournaments.map(t=>new Date(t.date).getFullYear()))).sort((a,b)=>b-a);
 document.getElementById('filterYear').innerHTML='<option value="">Alle Jahre</option>'+years.map(y=>`<option>${y}</option>`).join('');
 populateCourseDropdowns();
}

/* Render all */
function renderAll(){populateFilters();renderCourses();renderSummaryAndChart();renderBirdies();renderRecentList();renderBestOfHole();}
renderAll();
</script>
</body>
</html>
