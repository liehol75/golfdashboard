<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golf-Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0f1724;color:#eee;margin:0}
.container{max-width:1250px;margin:auto;padding:20px}
h1{margin:0 0 15px;font-size:28px;font-weight:600}
h2{margin:0 0 10px;font-size:20px}
.card{background:#1b2637;padding:20px;border-radius:12px;margin-bottom:25px;box-shadow:0 0 10px rgba(0,0,0,0.3)}
select,input,button{padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:#243447;color:#eee;margin:4px 0}
button{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}
.eagle{background:#4ade80}.birdie{background:#22d3ee}.par{background:#60a5fa}.bogey{background:#facc15;color:#000}.dbl{background:#f87171}
a{color:#60a5fa;text-decoration:none}
.scorecard td{border:1px solid rgba(255,255,255,0.1)}
.vorgabe-striche{font-size:10px;color:#cbd5e1}
</style>
</head>
<body>
<div class="container">
<h1>🏌️ Golf-Dashboard</h1>
<p><a href="manage.html">➕ Plätze & Turniere anlegen</a></p>

<div class="card">
<h2>Übersicht</h2>
<label for="filterYear">Jahr filtern:</label>
<select id="filterYear"></select>
<button onclick="applyFilters()">Anwenden</button>
<button onclick="resetFilters()">Reset</button>
<div id="summary"></div>
<canvas id="chartScores" height="100"></canvas>
</div>

<div class="card">
<h2>Top 10 Runden</h2>
<div id="topRounds"></div>
</div>

<div class="card">
<h2>Birdies</h2>
<div id="birdieList"></div>
</div>

<div class="card">
<h2>Best Scores pro Loch</h2>
<select id="bestCourse" onchange="renderBestOfHole()"></select>
<div id="bestTable"></div>
</div>

<div class="card">
<h2>Turnier ansehen</h2>
<input id="search" placeholder="Turniername suchen..." oninput="filterTournamentList()">
<select id="tournamentSelect" onchange="renderSelectedTournament()"></select>
<div id="tournamentDetails"></div>
</div>

<div class="card">
<h2>Letzte Turniere</h2>
<div id="recentList"></div>
</div>
</div>

<script>
const STORAGE_KEY='golf_dash_full4';
let state={courses:[],tournaments:[]};
if(localStorage.getItem(STORAGE_KEY))state=JSON.parse(localStorage.getItem(STORAGE_KEY));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function fmtDate(d){return new Date(d).toLocaleDateString('de-DE')}
function classify(par,strokes){
 if(!strokes||strokes<=0)return'';
 const diff=strokes-par;
 if(diff<=-2)return'eagle';
 if(diff==-1)return'birdie';
 if(diff==0)return'par';
 if(diff==1)return'bogey';
 return'dbl';
}
let currentYear='';let chartScores;
function applyFilters(){currentYear=document.getElementById('filterYear').value;renderAll()}
function resetFilters(){currentYear='';renderAll()}
function sumAdjGross(t){return t.holes.reduce((s,h)=>s+(h.strokes||0),0)}

function renderSummaryAndChart(){
 const data=state.tournaments.filter(t=>!currentYear||new Date(t.date).getFullYear().toString()==currentYear);
 const total=data.length;const n18=data.filter(t=>t.holes.length>=18).length;const n9=data.filter(t=>t.holes.length<18).length;
 document.getElementById('summary').innerHTML=`<p><strong>Gesamt:</strong> ${total} | <strong>18-Loch:</strong> ${n18} | <strong>9-Loch:</strong> ${n9}</p>`;
 const labels=data.map(t=>fmtDate(t.date));const scores=data.map(t=>sumAdjGross(t));
 if(chartScores)chartScores.destroy();
 chartScores=new Chart(document.getElementById('chartScores'),{type:'line',data:{labels,datasets:[{label:'Score',data:scores,borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,0.3)',fill:true}]},options:{plugins:{legend:{display:false}}}});
}

function renderTopRounds(){
 const div=document.getElementById('topRounds');
 const rounds=state.tournaments.filter(t=>!currentYear||new Date(t.date).getFullYear().toString()==currentYear)
   .map(t=>({date:t.date,score:sumAdjGross(t),name:t.name,course:state.courses.find(c=>c.id===t.courseId)?.name||'?'}))
   .sort((a,b)=>a.score-b.score).slice(0,10);
 if(!rounds.length){div.textContent='Keine Runden';return}
 div.innerHTML='<table><tr><th>Datum</th><th>Turnier</th><th>Platz</th><th>Score</th></tr>'+
 rounds.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.name}</td><td>${r.course}</td><td>${r.score}</td></tr>`).join('')+'</table>';
}

function renderBirdies(){
 const div=document.getElementById('birdieList');div.innerHTML='';
 const birdies=[];
 state.tournaments.forEach(t=>{
 if(currentYear&&new Date(t.date).getFullYear().toString()!=currentYear)return;
 const c=state.courses.find(x=>x.id===t.courseId);
 t.holes.forEach(h=>{if(classify(h.par,h.strokes)=='birdie')birdies.push({date:t.date,course:c?c.name:'?',hole:h.num});});
 });
 if(!birdies.length){div.textContent='Keine Birdies';return}
 div.innerHTML='<table><tr><th>Datum</th><th>Platz</th><th>Loch</th></tr>'+birdies.map(b=>`<tr><td>${fmtDate(b.date)}</td><td>${b.course}</td><td>${b.hole}</td></tr>`).join('')+'</table>';
}

function renderBestOfHole(){
 const id=document.getElementById('bestCourse').value;const c=state.courses.find(x=>x.id===id);
 if(!c){document.getElementById('bestTable').innerHTML='';return}
 const best=Array.from({length:c.holes.length}).map(()=>null);
 state.tournaments.forEach(t=>{
 if(t.courseId!==id)return;if(currentYear&&new Date(t.date).getFullYear().toString()!=currentYear)return;
 t.holes.forEach(h=>{const idx=h.num-1;if(!best[idx]||h.strokes<best[idx])best[idx]=h.strokes;});
 });
 let html='<table><tr><th>Loch</th><th>Par</th><th>Bester Score</th></tr>';
 c.holes.forEach((h,i)=>{const sc=best[i];const cls=sc?classify(h.par,sc):'';html+=`<tr><td>${h.num}</td><td>${h.par}</td><td class="${cls}">${sc?sc:'-'}</td></tr>`});
 html+='</table>';document.getElementById('bestTable').innerHTML=html;
}

function renderRecentList(){
 const div=document.getElementById('recentList');div.innerHTML='';
 const list=state.tournaments.filter(t=>!currentYear||new Date(t.date).getFullYear().toString()==currentYear)
 .slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
 list.forEach(t=>{
 const c=state.courses.find(x=>x.id===t.courseId);
 let html=`<div style="margin-bottom:12px"><strong>${t.name}</strong> (${fmtDate(t.date)}) ${c?c.name:''}<br><table><tr>`;
 t.holes.forEach(h=>{const cls=classify(h.par,h.strokes);html+=`<td class="${cls}">${h.strokes}</td>`});
 html+='</tr></table></div>';div.innerHTML+=html;
 });
}

function populateFilters(){
 const years=Array.from(new Set(state.tournaments.map(t=>new Date(t.date).getFullYear()))).sort((a,b)=>b-a);
 document.getElementById('filterYear').innerHTML='<option value="">Alle Jahre</option>'+years.map(y=>`<option>${y}</option>`).join('');
 document.getElementById('bestCourse').innerHTML='<option value="">-- Platz --</option>'+state.courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
 populateTournamentDropdown();
}

function populateTournamentDropdown(){
 const select=document.getElementById('tournamentSelect');
 select.innerHTML='<option value="">-- Turnier auswählen --</option>'+state.tournaments.map(t=>{
 const c=state.courses.find(x=>x.id===t.courseId);
 return `<option value="${t.id}">${fmtDate(t.date)} - ${t.name} (${c?c.name:''})</option>`;
 }).join('');
}

function filterTournamentList(){
 const search=document.getElementById('search').value.toLowerCase();
 const select=document.getElementById('tournamentSelect');
 select.innerHTML='<option value="">-- Turnier auswählen --</option>'+state.tournaments.filter(t=>t.name.toLowerCase().includes(search)).map(t=>{
 const c=state.courses.find(x=>x.id===t.courseId);
 return `<option value="${t.id}">${fmtDate(t.date)} - ${t.name} (${c?c.name:''})</option>`;
 }).join('');
}

function renderSelectedTournament(){
 const id=document.getElementById('tournamentSelect').value;const t=state.tournaments.find(x=>x.id===id);
 if(!t){document.getElementById('tournamentDetails').innerHTML='';return}
 const c=state.courses.find(x=>x.id===t.courseId);
 let header=`<h3>${t.name}</h3><p>${fmtDate(t.date)} – ${t.club}<br>Platz: ${c?c.name:''}, Tee: <span style="background:${c?c.teeColor:''};padding:2px 6px;border-radius:4px;color:#000">${c?c.teeColor:''}</span><br>Handicap: ${t.handicapIndex||'-'}</p>`;
 let table='<table class="scorecard"><tr><th>Loch</th><th>Par</th><th>HCP</th><th>Vorgabe</th><th>Score</th></tr>';
 t.holes.forEach(h=>{
 const cls=classify(h.par,h.strokes);
 // kleine Striche für Vorgabe je Punkt
 const striche='<span class="vorgabe-striche">'+('│'.repeat(Math.min(h.hcp,4)))+'</span>'; 
 table+=`<tr>
 <td>${h.num}</td>
 <td>${h.par}</td>
 <td>${h.hcp}</td>
 <td>${striche}</td>
 <td class="${cls}">${h.strokes}</td>
 </tr>`;
 });
 table+='</table>';
 document.getElementById('tournamentDetails').innerHTML=header+table;
}

function renderAll(){populateFilters();renderSummaryAndChart();renderTopRounds();renderBirdies();renderRecentList();renderBestOfHole();}
renderAll();
</script>
</body>
</html>
