function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(s){if(!s)return '–';const d=new Date(s);return Number.isNaN(d.getTime())?esc(s):d.toLocaleDateString('de-DE')}
function rounds(){return db.rounds.filter(r=>r.Status!=='abgesagt'&&r['Turnier']!=='AHMIGO - GIPT Cup 18 Loch -abgesagt-')}
function activeRounds(){return rounds().filter(r=>yearFilter==='all'||String(r.Jahr)===String(yearFilter)).filter(r=>clubFilter==='all'||r.Golfclub===clubFilter).filter(r=>formatFilter==='all'||r.Format===formatFilter)}
function keyDate(v){if(!v)return'';let s=String(v);let m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;let d=new Date(v);return Number.isNaN(d.getTime())?s:d.toISOString().slice(0,10)}
function roundKey(r){return [keyDate(r.Datum),String(r.Golfclub??'').trim(),String(r.Turnier??'').trim()].join('|')}
function holeMap(){const m=new Map();(db.holes||[]).forEach(h=>m.set(roundKey(h),h));return m}
function scoreClass(s,par){if(s===null||s===undefined||s===''||s==='–'||s==='-'||String(s).includes('?'))return'unknown';let n=num(s),p=num(par);if(n==null||p==null)return'unknown';let d=n-p;return d<=-3?'albatross':d===-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':d===2?'double':d===3?'triple':'over'}
function scoreLabel(s,par){let c=scoreClass(s,par);return({albatross:'Albatross / -3+',eagle:'Eagle',birdie:'Birdie',par:'Par',bogey:'Bogey',double:'Doppelbogey',triple:'Triplebogey',over:'+'+(num(s)-num(par)),unknown:'nicht eindeutig'})[c]}
function scoreDelta(s,par){let n=num(s),p=num(par);return n==null||p==null?null:n-p}
function scoreBuckets(){return['albatross','eagle','birdie','par','bogey','double','triple','over','unknown']}
function stats(rs){let c={albatross:0,eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0,over:0,unknown:0,holes:0};const hm=holeMap();rs.forEach(r=>{const h=hm.get([r.Datum,r.Golfclub,r.Turnier].join('|'));if(!h)return;let arr=[...(String(h['Score Loch 1-9']||'').split(',')),...(String(h['Score Loch 10-18']||'').split(','))];arr.forEach((s,i)=>{let hp=holePar(h,i),cl=scoreClass(s,hp);c[cl]++;if(cl!=='unknown')c.holes++})});return c}
function holeValues(h){return [...(String(h['Score Loch 1-9']||'').split(',')),...(String(h['Score Loch 10-18']||'').split(','))].filter(x=>x!=='')}
function roundScore(r){let n=num(r.GBE),p=num(r.Par);return n!=null&&p!=null?{gross:n,par:p,rel:n-p}:null}
function roundSD(r){let g=num(r.GBE),cr=num(r['Course Rating']),sl=num(r.Slope);return g!=null&&cr!=null&&sl!=null&&sl>0?(g-cr)*113/sl:null}
function roundNet(r){let v=num(r.Netto);if(v!=null)return v;v=num(r['Netto-Ergebnis']);if(v!=null)return v;return null}
function scoreStatsRows(rs){const groups={};rs.forEach(r=>{const y=String(r.Jahr||'unbekannt');(groups[y]??=[]).push(r)});return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,a])=>({name:y,rs:a,stats:stats(a)}))}
function holePar(h,i){const keys=[`Par Loch ${i+1}`,`Par ${i+1}`,`Loch ${i+1} Par`];for(const k of keys){const v=num(h[k]);if(v!=null)return v}const a=Array.isArray(h.holePar)?h.holePar:null;if(a&&num(a[i])!=null)return num(a[i]);return null} // never invent hole par
function kpi(label,n){return `<div class="card kpi"><div class="n">${esc(n)}</div><div class="l">${esc(label)}</div></div>`}
function nav(){return `<div class="nav">${[['dashboard','Dashboard'],['rounds','Runden'],['places','Plätze'],['stats','Statistik'],['handicap','Handicap'],['scorecards','Scorekarten'],['data','Daten']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="setView('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function header(){return `<div class="top"><div class="brand"><div><h1>⛳ Golf-Runden Analyse</h1><small>Golfhistorie · Analyse · Handicap</small></div><button onclick="showHelp()">?</button></div>${nav()}</div>`}
function filters(){const years=[...new Set(db.rounds.map(r=>r.Jahr).filter(Boolean))].sort((a,b)=>b-a);const clubs=[...new Set(db.rounds.map(r=>r.Golfclub).filter(Boolean))].sort();const formats=[...new Set(db.rounds.map(r=>r.Format).filter(Boolean))].sort();return `<div class="toolbar"><select onchange="yearFilter=this.value;render()"><option value="all">Alle Jahre</option>${years.map(y=>`<option ${String(yearFilter)===String(y)?'selected':''} value="${y}">${y}</option>`).join('')}</select><select onchange="clubFilter=this.value;render()"><option value="all">Alle Plätze</option>${clubs.map(c=>`<option ${clubFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="formatFilter=this.value;render()"><option value="all">Alle Formate</option>${formats.map(f=>`<option ${formatFilter===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>`}
function dashboard(){const all=rounds(),rs=activeRounds(),thisYear=new Date().getFullYear(),yr=all.filter(r=>Number(r.Jahr)===thisYear),prev=all.filter(r=>Number(r.Jahr)===thisYear-1),clubs=new Set(all.map(r=>r.Golfclub).filter(Boolean));const s=stats(all);return `<section>${filters()}<div class="grid">${kpi('Runden gesamt',all.length)}${kpi('Turniere gesamt',new Set(all.map(r=>r.Turnier).filter(Boolean)).size)}${kpi('Runden 2026',yr.length)}${kpi('Runden 2025',prev.length)}${kpi('Plätze',clubs.size)}${kpi('Birdies',s.birdie)}${kpi('Eagles',s.eagle)}${kpi('Pars',s.par)}${kpi('Bogeys',s.bogey)}</div><div class="two"><div class="card"><h2>Ergebnisentwicklung</h2><div class="chart" id="trend"></div></div><div class="card"><h2>Score-Verteilung</h2><div class="chart" id="pie"></div><div class="legend">${['eagle','birdie','par','bogey','double','triple','over','dash'].map(x=>`<span><i class="dot"></i>${x}</span>`).join('')}</div></div></div><div class="section"><div class="card"><h2>Top 10 Runden</h2>${topTable(all,sortTop)}</div></div></section>`}
function topTable(rs,mode){let arr=rs.map(r=>{let v=mode==='gross'?num(r.GBE):mode==='net'?roundNet(r):mode==='stable'?num(r.SNP):mode==='sd'?roundSD(r):roundScore(r)?.rel;return {...r,_v:v}}).filter(r=>r._v!=null);arr.sort((a,b)=>mode==='stable'?b._v-a._v:a._v-b._v);const labels={gross:'Brutto',net:'Netto',stable:'Stableford',sd:'Score Differential',rel:'Relativ zu Par'};return `<div class="tabs">${[['gross','Brutto'],['net','Netto'],['stable','Stableford'],['sd','Score Differential'],['rel','Relativ zu Par']].map(x=>`<button class="${sortTop===x[0]?'active':''}" onclick="sortTop='${x[0]}';render()">${x[1]}</button>`).join('')}</div><p class="muted">Top 10 nach <b>${labels[mode]}</b>. Bei Gleichstand bleibt das frühere Ergebnis nicht automatisch bevorzugt.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>#</th><th>Datum</th><th>Platz</th><th>Turnier</th><th>Wert</th><th>Par</th><th>HCPI</th></tr></thead><tbody>${arr.slice(0,10).map((r,i)=>`<tr onclick='openRound(${JSON.stringify(r).replace(/'/g,"&#39;")})'><td>${i+1}</td><td>${dateFmt(r.Datum)}</td><td>${esc(r.Golfclub)}</td><td>${esc(r.Turnier)}</td><td><b>${mode==='sd'?r._v.toFixed(2):r._v}</b></td><td>${esc(r.Par??'–')}</td><td>${esc(r.HCPI??'–')}</td></tr>`).join('')}</tbody></table></div>`}
function roundsView(){const rs=activeRounds().sort((a,b)=>String(b.Datum).localeCompare(String(a.Datum)));return `<section>${filters()}<div class="card"><h2>Runden · ${rs.length}</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Datum</th><th>Platz</th><th>Turnier</th><th>Format</th><th>Löcher</th><th>Tees</th><th>Par</th><th>CR</th><th>Slope</th><th>HCPI</th><th>GBE</th><th>HC-relevant</th></tr></thead><tbody>${rs.map(r=>`<tr onclick='openRound(${JSON.stringify(r).replace(/'/g,"&#39;")})'><td>${dateFmt(r.Datum)}</td><td>${esc(r.Golfclub)}</td><td>${esc(r.Turnier)}</td><td>${esc(r.Format)}</td><td>${esc(r.Löcher)}</td><td>${esc(r.Tees)}</td><td>${esc(r.Par)}</td><td>${esc(r['Course Rating'])}</td><td>${esc(r.Slope)}</td><td>${esc(r.HCPI)}</td><td><b>${esc(r.GBE??'–')}</b></td><td>${esc(r['HCPI-relevant'])}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function places(){const rs=rounds();const m={};rs.forEach(r=>{const k=r.Golfclub||'Unbekannt';(m[k]??=[]).push(r)});const list=Object.entries(m).sort((a,b)=>b[1].length-a[1].length);const profiles=db.courseProfiles||[];return `<section>${filters()}<div class="grid">${kpi('Plätze gesamt',list.length)}${kpi('Meistgespielt',list[0]?.[0]||'–')}${kpi('Runden dort',list[0]?.[1].length||0)}${kpi('Platz-/Tee-Profile',profiles.length)}</div><div class="card"><h2>Plätze · Gesamtübersicht</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Platz</th><th>Runden</th><th>Beste GBE</th><th>Ø GBE</th><th>Birdies</th><th>Pars</th><th>Ratings</th><th></th></tr></thead><tbody>${list.map(([c,a])=>{let g=a.map(x=>num(x.GBE)).filter(x=>x!=null);let st=stats(a);let p=profiles.filter(x=>x.club===c);return `<tr><td><b>${esc(c)}</b></td><td>${a.length}</td><td>${g.length?Math.min(...g):'–'}</td><td>${g.length?(g.reduce((x,y)=>x+y,0)/g.length).toFixed(1):'–'}</td><td>${st.birdie}</td><td>${st.par}</td><td>${p.reduce((n,x)=>n+x.ratings.length,0)}</td><td><button onclick='clubFilter=${JSON.stringify(c)};view="rounds";render()'>Runden</button></td></tr>`}).join('')}</tbody></table></div></div><div class="card section"><h2>Platz / Tee / Rating-Historie</h2><p class="muted">Jede Kombination aus Platz, Kurs und Tee wird separat geführt. Ändern sich Course Rating, Slope oder Par über die Jahre, bleiben die historischen Varianten erhalten und werden nicht überschrieben.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>Club</th><th>Kurs</th><th>Tee</th><th>Runden</th><th>Rating-Historie</th></tr></thead><tbody>${profiles.map(p=>`<tr><td>${esc(p.club)}</td><td>${esc(p.course)}</td><td>${esc(p.tee)}</td><td>${p.rounds}</td><td>${p.ratings.map(x=>`${esc(x.date)} · Par ${esc(x.par??'–')} · CR ${esc(x.cr??'–')} · Slope ${esc(x.slope??'–')}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function statsView(){const rs=activeRounds(),s=stats(rs),groups=scoreStatsRows(rs),total=scoreBuckets().reduce((n,k)=>n+s[k],0);return `<section>${filters()}<div class="grid">${kpi('Erfasste Lochwerte',s.holes)}${kpi('Birdies',s.birdie)}${kpi('Eagles',s.eagle)}${kpi('Pars',s.par)}${kpi('Bogeys',s.bogey)}${kpi('Doppelbogeys',s.double)}${kpi('Triplebogeys',s.triple)}${kpi('Weitere +',s.over)}${kpi('Nicht eindeutig',s.unknown)}</div><div class="two"><div class="card"><h2>Score-Verteilung</h2><div class="chart" id="pie2"></div><div class="muted">Nur eindeutig klassifizierbare Lochwerte werden als echte Scorekategorie gezählt.</div></div><div class="card"><h2>Auswertungsebenen</h2><p>Die Filter wirken auf alle Kennzahlen dieser Ansicht.</p><p><b>Gesamt:</b> alle gespeicherten Runden · <b>Jahr:</b> über Jahresfilter · <b>Platz:</b> über Platzfilter.</p><p>„Nicht eindeutig“ bleibt sichtbar und wird nicht stillschweigend als Strich interpretiert.</p></div></div><div class="card section"><h2>Score-Verteilung nach Jahr</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Jahr</th><th>Eagles</th><th>Birdies</th><th>Pars</th><th>Bogeys</th><th>Doppel</th><th>Triple</th><th>Weitere +</th><th>Offen</th></tr></thead><tbody>${groups.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.stats.eagle}</td><td>${g.stats.birdie}</td><td>${g.stats.par}</td><td>${g.stats.bogey}</td><td>${g.stats.double}</td><td>${g.stats.triple}</td><td>${g.stats.over}</td><td>${g.stats.unknown}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function handicap(){const all=rounds().filter(r=>String(r['HCPI-relevant']).toLowerCase()==='ja'&&num(r.GBE)!=null&&num(r['Course Rating'])!=null&&num(r.Slope)!=null&&num(r.Slope)>0).sort((a,b)=>String(a.Datum).localeCompare(String(b.Datum)));let hist=[];for(let i=0;i<all.length;i++){const cur=all.slice(0,i+1),last20=cur.slice(-20),sds=last20.map(r=>({...r,SD:roundSD(r)})).filter(x=>x.SD!=null),n=sds.length;if(!n)continue;let take=n>=20?8:n===19?7:n>=17?6:n>=15?5:n>=12?4:n>=9?3:n>=6?2:1;let adj=n<=3?-2:n===4?-1:0;let raw=sds.map(x=>x.SD).sort((a,b)=>a-b).slice(0,take).reduce((a,b)=>a+b,0)/take+adj;let prior=hist.length?hist[hist.length-1].hi:null;let low=(i>0?Math.min(...hist.slice(Math.max(0,hist.length-365),hist.length).map(x=>x.hi).filter(v=>Number.isFinite(v))):raw);let capped=raw;if(hist.length>=1&&Number.isFinite(low)){let rise=raw-low;if(rise>3)capped=low+3+(rise-3)*.5;if(capped>low+5)capped=low+5}hist.push({d:all[i].Datum,sd:roundSD(all[i]),raw,capped,hi:capped,low});}let last=hist.at(-1);return `<section><div class="three"><div class="card"><h2>Gespeicherter HCPI</h2><p class="muted">Amtlicher Wert aus der Datenbasis, unverändert.</p><div class="n">${esc(all.at(-1)?.HCPI??'–')}</div></div><div class="card"><h2>WHS-Rekonstruktion</h2><p class="muted">Historische Rekonstruktion aus den vorhandenen Daten. Nicht amtlich.</p><div class="n">${last?last.capped.toFixed(1):'–'}</div></div><div class="card"><h2>Verwertbare Runden</h2><div class="n">${all.length}</div><div class="muted">mit GBE + CR + Slope + HC-Relevanz</div></div></div><div class="card section"><h2>Handicapentwicklung</h2><div class="chart" id="hcchart"></div><div class="note">Die Rekonstruktion berücksichtigt die vorhandenen Score Differentials und die Best-of-20-Logik sowie Soft-/Hard-Cap. PCC, Exceptional Score Reduction, vollständige 9-Loch-Kombinationen und amtliche Ausschluss-/Anpassungsinformationen werden nur berücksichtigt, wenn sie in den Daten eindeutig vorhanden sind.</div></div><div class="card"><h3>Historisch vs. rekonstruiert</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Datum</th><th>HCPI gespeichert</th><th>SD</th><th>Rohwert</th><th>Cap-Wert</th><th>GBE</th></tr></thead><tbody>${all.slice(-40).reverse().map(r=>{let x=hist.findLast(z=>z.d===r.Datum);return `<tr><td>${dateFmt(r.Datum)}</td><td>${esc(r.HCPI??'–')}</td><td>${roundSD(r)?.toFixed(2)??'–'}</td><td>${x?.raw.toFixed(1)??'–'}</td><td>${x?.capped.toFixed(1)??'–'}</td><td>${esc(r.GBE)}</td></tr>`}).join('')}</tbody></table></div></div></section>`}
function scorecards(){const rs=rounds().filter(r=>holeMap().has([r.Datum,r.Golfclub,r.Turnier].join('|')));return `<section>${filters()}<div class="card"><h2>Scorekarten · ${rs.length} mit vorhandenen Lochdaten</h2><p class="muted">Die vollständige Historie bleibt durchsuchbar. Eine Lochdarstellung wird nur erzeugt, wenn die Lochwerte eindeutig in den Daten vorhanden sind.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>Datum</th><th>Platz</th><th>Turnier</th><th>GBE</th><th>Status</th><th></th></tr></thead><tbody>${rs.map(r=>{let h=holeMap().get(roundKey(r));return `<tr><td>${dateFmt(r.Datum)}</td><td>${esc(r.Golfclub)}</td><td>${esc(r.Turnier)}</td><td>${esc(r.GBE??'–')}</td><td>${esc(h['Status/Unsicherheit']??'–')}</td><td><button onclick='openRound(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Scorekarte</button></td></tr>`}).join('')}</tbody></table></div></div></section>`}
function dataView(){return `<section><div class="card"><h2>Datenverwaltung</h2><div class="grid">${kpi('Runden',db.rounds.length)}${kpi('Lochdaten',db.holes?.length||0)}${kpi('Team-/nicht HC',db.nonHandicap?.length||0)}${kpi('Platz-/Tee-Profile',db.courseProfiles?.length||0)}${kpi('Quelle','v1.8')}</div><div class="toolbar"><button onclick="exportJSON()">JSON exportieren</button><label><button onclick="document.getElementById('file').click()">JSON importieren</button></label><input id="file" type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])"></div><div class="note">Die aktuell eingebetteten Daten stammen aus der gefundenen Masterdatei v1.8: 427 HHS-Runden, Scorekarten-Lochdaten separat und nicht vorgabewirksame Team-/Scramble-Ergebnisse separat. Unklare Lochwerte bleiben unklar.</div></div></section>`}
function render(){document.getElementById('app').innerHTML=`<div class="app">${header()}<main>${view==='dashboard'?dashboard():view==='rounds'?roundsView():view==='places'?places():view==='stats'?statsView():view==='handicap'?handicap():view==='scorecards'?scorecards():dataView()}</main></div>`;setTimeout(drawCharts,0)}
function setView(v){view=v;render();scrollTo(0,0)}
function drawCharts(){const rs=rounds().filter(r=>num(r.GBE)!=null).sort((a,b)=>String(a.Datum).localeCompare(String(b.Datum)));drawLine('trend',rs.map(r=>num(r.GBE)));const s=stats(rounds());drawPie('pie',[s.albatross,s.eagle,s.birdie,s.par,s.bogey,s.double,s.triple,s.over]);drawPie('pie2',[s.albatross,s.eagle,s.birdie,s.par,s.bogey,s.double,s.triple,s.over]);let h=rounds().filter(r=>String(r['HCPI-relevant']).toLowerCase()==='ja'&&num(r.GBE)!=null&&num(r['Course Rating'])!=null&&num(r.Slope)!=null&&num(r.Slope)>0).sort((a,b)=>String(a.Datum).localeCompare(String(b.Datum)));let vals=[];for(let i=0;i<h.length;i++){let x=h.slice(Math.max(0,i-19),i+1).map(roundSD).filter(v=>v!=null).sort((a,b)=>a-b);let n=x.length,t=n>=20?8:n===19?7:n>=17?6:n>=15?5:n>=12?4:n>=9?3:n>=6?2:1;let a=n<=3?-2:n===4?-1:0;let raw=x.slice(0,t).reduce((p,q)=>p+q,0)/t+a;let prev=vals.at(-1),low=prev==null?raw:Math.min(...vals.slice(Math.max(0,vals.length-365)));let capped=raw;if(prev!=null){let rise=raw-low;if(rise>3)capped=low+3+(rise-3)*.5;if(capped>low+5)capped=low+5}vals.push(capped)}drawLine('hcchart',vals)}
function drawLine(id,vals){const el=document.getElementById(id);if(!el||!vals.length)return;const w=900,h=250,p=22,min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;let pts=vals.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(v-min)*(h-2*p)/range}`).join(' ');el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#b9f36a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#344038"/><line x1="${p}" x2="${p}" y1="${p}" y2="${h-p}" stroke="#344038"/></svg>`}
function drawPie(id,v){const el=document.getElementById(id);if(!el)return;const sum=v.reduce((a,b)=>a+b,0)||1;let a=0,paths='';const colors=['#7c5cff','#2fbcff','#2f9b62','#e0a33a','#d96a6a','#9e3e50','#6b3038','#303833'];v.forEach((x,i)=>{let b=a+x/sum*Math.PI*2;let r=90,cx=150,cy=125;let x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);let large=b-a>Math.PI?1:0;paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${colors[i]}" stroke="#0d1310" stroke-width="2"/>`;a=b});el.innerHTML=`<svg viewBox="0 0 300 250"><g transform="translate(0,0)">${paths}</g></svg>`}
function openRound(r){const h=holeMap().get(roundKey(r));let body=`<div class="modal"><div class="modalbox"><button class="close" onclick="this.closest('.modal').remove()">Schließen</button><h2>${esc(r.Turnier)}</h2><p class="muted">${dateFmt(r.Datum)} · ${esc(r.Golfclub)} · ${esc(r.Course||'')} · ${esc(r.Tees)} · Par ${esc(r.Par)} · CR ${esc(r['Course Rating'])} · Slope ${esc(r.Slope)} · HCPI ${esc(r.HCPI)} · CH ${esc(r['Course Handicap (CH)'])} · PH ${esc(r['Playing Handicap (PH)'])}</p><div class="grid">${kpi('GBE',r.GBE??'–')}${kpi('Stableford',r.SNP??'–')}${kpi('HC-relevant',r['HCPI-relevant']??'–')}${kpi('Scorecard',h?'vorhanden':'nicht vorhanden')}</div>`;if(h){let arr=holeValues(h);body+=`<div class="note">${esc(h['Status/Unsicherheit']||'')}</div><h3>Brutto · Loch für Loch</h3><div class="holegrid">${arr.map((s,i)=>{let par=holePar(h,i),cl=scoreClass(s,par);return `<div class="hole"><span class="muted">Loch ${i+1}</span><b class="score ${cl}">${esc(s)}</b><small>${par==null?'Par unbekannt':scoreLabel(s,par)}</small></div>`}).join('')}</div><h3>Netto · Loch für Loch</h3><div class="empty">Netto-Lochwerte werden erst berechnet, wenn die Vorgabenverteilung (Stroke Index) für genau dieses Tee und den historischen Rating-Zustand eindeutig vorliegt. Vorhandene Netto-Gesamtwerte werden nicht auf einzelne Bahnen zurückgerechnet.</div>`}else body+=`<div class="empty">Für diese Runde sind derzeit keine eindeutigen Loch-für-Loch-Daten in der Masterdatei hinterlegt.</div>`;body+='</div></div>';document.body.insertAdjacentHTML('beforeend',body)}
function showHelp(){alert('Golf-Runden Analyse\n\nDie App arbeitet datengetrieben. Unklare Werte werden nicht erfunden. Ratings werden pro Runde gespeichert, sodass historische Änderungen von Course Rating/Slope/Tees erhalten bleiben.\n\nDaten: Masterdatei v1.8. Platz-/Tee-Profile und historische Ratingvarianten sind separat gespeichert.')}
function exportJSON(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Golf-Deluxe-Daten.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.rounds)throw Error('Ungültige Datei');db=x;save();render();alert('Daten importiert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};rd.readAsText(file)}
render();
</script></body></html>
