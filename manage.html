<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golf-Verwaltung</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Inter',sans-serif;
  background:#0f1724;
  color:#eee;
  margin:0;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{
  margin:0 0 20px;
  font-size:28px;
  font-weight:600;
}
.card{
  background:#1b2637;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}
label{
  display:block;
  margin-top:12px;
  font-size:13px;
  color:#cbd5e1;
}
input,select,button{
  width:100%;
  padding:10px 12px;
  border-radius:6px;
  border:1px solid rgba(255,255,255,0.1);
  background:#243447;
  color:#eee;
  font-size:14px;
  margin-top:4px;
  box-sizing:border-box;
}
button{
  cursor:pointer;
  margin-top:15px;
  background:#60a5fa;
  color:#0f1724;
  font-weight:600;
  border:none;
  transition:background .2s;
}
button:hover{background:#3b82f6}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  margin-top:15px;
}
th,td{
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  text-align:center;
}
a{color:#60a5fa;text-decoration:none}
.section-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:10px;
}
</style>
</head>
<body>
<div class="container">
<h1>Verwaltung</h1>
<p><a href="index.html">⬅️ zurück zum Dashboard</a></p>

<div class="card">
<div class="section-title">Platz anlegen</div>
<form id="courseForm">
<label for="cName">Platzname</label>
<input id="cName" required>
<label for="cColor">Tee-Farbe</label>
<select id="cColor">
<option value="#ffffff">Weiß</option>
<option value="#ffff00">Gelb</option>
<option value="#1e90ff">Blau</option>
<option value="#ff0000">Rot</option>
<option value="#00ff00">Grün</option>
</select>
<label for="cSlope">Slope</label>
<input id="cSlope" type="number" required>
<label for="cCR">Course Rating</label>
<input id="cCR" type="number" required>
<button type="button" onclick="showHoleInputs()">Löcher definieren</button>
<button type="submit">Platz speichern</button>
</form>
<div id="holesForm"></div>
<div id="courseList"></div>
</div>

<div class="card">
<div class="section-title">Turnier anlegen</div>
<form id="tournamentForm">
<label for="tDate">Datum</label>
<input type="date" id="tDate" required>
<label for="tName">Turniername</label>
<input id="tName" required>
<label for="tClub">Club</label>
<input id="tClub" required>
<label for="tCourse">Platz</label>
<select id="tCourse"></select>
<label for="tHcp">Handicap Index</label>
<input type="number" id="tHcp">
<label for="tFormat">Spielform</label>
<select id="tFormat"><option>Stroke</option><option>Stableford</option></select>
<button type="submit">Turnier speichern</button>
</form>
<div id="holeEntry"></div>
</div>
</div>

<script>
const STORAGE_KEY='golf_dash_full4';
let state={courses:[],tournaments:[]};
if(localStorage.getItem(STORAGE_KEY))state=JSON.parse(localStorage.getItem(STORAGE_KEY));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function uid(p='id'){return p+Math.random().toString(36).slice(2,9)}

function showHoleInputs(){
 let html='<table><tr><th>Loch</th><th>Par</th><th>HCP</th></tr>';
 for(let i=1;i<=18;i++){
 html+=`<tr><td>${i}</td><td><input type="number" id="par${i}" value="4" style="width:60px"></td><td><input type="number" id="hcp${i}" value="${i}" style="width:60px"></td></tr>`;
 }
 html+='</table>';
 document.getElementById('holesForm').innerHTML=html;
}

document.getElementById('courseForm').addEventListener('submit',e=>{
 e.preventDefault();
 const holes=[];
 for(let i=1;i<=18;i++){
 holes.push({num:i,par:+document.getElementById('par'+i).value,hcp:+document.getElementById('hcp'+i).value});
 }
 const c={id:uid('c'),name:cName.value,teeColor:cColor.value,slope:+cSlope.value,courseRating:+cCR.value,
 holes:holes,par:holes.reduce((s,h)=>s+h.par,0)};
 state.courses.push(c);save();renderCourses();populateCourseDropdowns();
 cName.value='';document.getElementById('holesForm').innerHTML='';
});

function renderCourses(){
 let html='';
 state.courses.forEach(c=>{html+=`<div style="margin-top:6px"><strong>${c.name}</strong> (Slope ${c.slope}, CR ${c.courseRating})</div>`});
 document.getElementById('courseList').innerHTML=html;
}

function populateCourseDropdowns(){
 document.getElementById('tCourse').innerHTML='<option value="">-- Platz wählen --</option>'+state.courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

document.getElementById('tournamentForm').addEventListener('submit',e=>{
 e.preventDefault();
 const cid=tCourse.value;const c=state.courses.find(x=>x.id===cid);if(!c)return alert('Platz wählen');
 const t={id:uid('t'),name:tName.value,club:tClub.value,date:tDate.value,courseId:cid,handicapIndex:+tHcp.value,format:tFormat.value,
 holes:c.holes.map(h=>({num:h.num,par:h.par,hcp:h.hcp,strokes:h.par,stroked:false}))};
 state.tournaments.push(t);save();renderHoleEntry(t);
});

function renderHoleEntry(t){
 const div=document.getElementById('holeEntry');
 let html=`<h3 style="margin-top:20px">Löcher für ${t.name}</h3><table><tr><th>Loch</th><th>Par</th><th>HCP</th><th>Strokes</th><th>Streichen</th></tr>`;
 t.holes.forEach(h=>{
 html+=`<tr>
 <td>${h.num}</td><td>${h.par}</td><td>${h.hcp}</td>
 <td><input type="number" value="${h.strokes}" style="width:60px" onchange="updateHole('${t.id}',${h.num},this.value)"></td>
 <td><input type="checkbox" ${h.stroked?'checked':''} onchange="toggleStroke('${t.id}',${h.num},this.checked)"></td>
 </tr>`;
 });
 html+='</table>';
 div.innerHTML=html;
}

function updateHole(tid,num,val){
 const t=state.tournaments.find(x=>x.id===tid);const h=t.holes.find(x=>x.num===num);h.strokes=+val;save();
}
function toggleStroke(tid,num,checked){
 const t=state.tournaments.find(x=>x.id===tid);const h=t.holes.find(x=>x.num===num);h.stroked=checked;save();
}

renderCourses();populateCourseDropdowns();
</script>
</body>
</html>
